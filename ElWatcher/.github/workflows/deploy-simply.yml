# ============================================================================
# deploy-simply.yml — Continuous Delivery, opdelt udgave (dag 4)
#
# Nyt i forhold til dag 3: workflowet er delt i to jobs.
#   byg     bygger appen og gemmer resultatet som artifact
#   deploy  henter artifactet og lægger det op via FTP
#
# Princippet hedder "build once, deploy many": det, der blev bygget, er
# præcis det, der bliver udrullet.
#
# Placeres i repoet under: .github/workflows/deploy-simply.yml
# ============================================================================
name: Deploy til Simply.com

permissions:
  contents: read

# BEMÆRK: ingen concurrency her. Et afbrudt FTP-upload efterlader en blanding
# af gamle og nye filer på serveren.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v6

      - name: Installer .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet-pakker
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # FORKLARING: Simply har kun .NET Framework 4.8 installeret, derfor
      # --self-contained. win-x86 fordi deres app pools kører 32-bit.
      - name: Byg self-contained til win-x86
        run: |
          dotnet publish DMI.Vejr.Web/DMI.Vejr.Web.csproj \
            --configuration Release \
            --runtime win-x86 \
            --self-contained true \
            --output ./udgivelse

      # FORKLARING: jobs kører på hver sin maskine og deler ikke filsystem.
      # Resultatet skal derfor gemmes, før deploy-jobbet kan bruge det.
      # retention-days: 5 — artifacts koster lagerplads, og appen er udrullet
      # med det samme. Standarden på 90 dage er spild her.
      - name: Gem udgivelsen som artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmi-app
          path: ./udgivelse
          retention-days: 5

  deploy:
    # FORKLARING: needs gør, at deploy først starter når byg er lykkedes.
    needs: byg
    runs-on: ubuntu-latest

    # Fjern kommenteringen for at kræve manuel godkendelse før udrulning.
    # environment:
    #   name: produktion
    #   url: https://dit-domaene.dk

    steps:
      - name: Hent udgivelsen
        uses: actions/download-artifact@v4
        with:
          name: dmi-app
          path: ./udgivelse

      - name: Skriv appsettings.Production.json
        run: |
          cat > ./udgivelse/appsettings.Production.json <<'SLUT'
          ${{ secrets.SIMPLY_APPSETTINGS }}
          SLUT

      - name: Læg filerne op via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./udgivelse/
          server-dir: /public_html/
