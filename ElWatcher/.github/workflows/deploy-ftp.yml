# ============================================================================
# deploy-ftp.yml — genbrugeligt udrulnings-workflow (bonusøvelse, dag 4)
#
# Kan ikke startes af sig selv. Kaldes af andre workflows med 'uses:'.
# Formålet er, at udrulningslogikken kun findes ét sted, selv om den bruges
# til flere miljøer.
#
# Placeres i repoet under: .github/workflows/deploy-ftp.yml
# ============================================================================
name: Genbrugelig FTP-udrulning

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      artifact_navn:
        description: 'Navnet på det artifact, der skal udrulles'
        required: false
        type: string
        default: 'dmi-app'
      maalmappe:
        description: 'Mappen på webhotellet, fx /public_html/ eller /public_html/staging/'
        required: true
        type: string
    secrets:
      # FORKLARING: et kaldt workflow ser IKKE kalderens secrets automatisk.
      # De skal erklæres her og sendes med eksplicit — eller med 'secrets: inherit'.
      #
      # Navnene er valgt, så de matcher repoets secrets ét til ét: FTP_SERVER,
      # FTP_USERNAME, FTP_PASSWORD og SIMPLY_APPSETTINGS. Det er ikke pedanteri.
      # 'secrets: inherit' matcher på navn (uden hensyn til store og små
      # bogstaver), og et navn, der ikke findes i repoet, giver en TOM værdi —
      # ikke en fejlmeddelelse. Havde den sidste heddet bare 'appsettings',
      # ville 'inherit' skrive en tom appsettings.Production.json hen over den
      # rigtige, og kørslen ville stadig være grøn.
      ftp_server:
        required: true
      ftp_username:
        required: true
      ftp_password:
        required: true
      simply_appsettings:
        required: true

jobs:
  udrul:
    runs-on: ubuntu-latest
    steps:
      - name: Hent udgivelsen
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_navn }}
          path: ./udgivelse

      - name: Skriv appsettings.Production.json
        run: |
          cat > ./udgivelse/appsettings.Production.json <<'SLUT'
          ${{ secrets.simply_appsettings }}
          SLUT

      - name: Læg filerne op via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server:     ${{ secrets.ftp_server }}
          username:   ${{ secrets.ftp_username }}
          password:   ${{ secrets.ftp_password }}
          local-dir:  ./udgivelse/
          server-dir: ${{ inputs.maalmappe }}
